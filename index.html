<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi primera página en GitHub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #24292f, #0969da);
            color: white;
            padding: 20px;
        }

        .card {
            max-width: 650px;
            width: 100%;
            background: white;
            color: #24292f;
            border-radius: 20px;
            padding: 50px 35px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .icon {
            font-size: 64px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #57606a;
            margin-bottom: 25px;
        }

        .status {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 30px;
            background: #dafbe1;
            color: #1a7f37;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            text-decoration: none;
            background: #24292f;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        .button:hover {
            opacity: 0.85;
        }

        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #8c959f;
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="icon">🚀</div>

        <h1>¡Hola, GitHub!</h1>

        <p>
            Esta es mi primera página web publicada con
            <strong>GitHub Pages</strong>.
        </p>

        <div class="status">
            ✅ Página funcionando correctamente
        </div>

        <p>
            Estoy aprendiendo a publicar proyectos en Internet
            utilizando GitHub.
        </p>

        <a
            class="button"
            href="https://github.com/"
            target="_blank">
            Visitar GitHub
        </a>

        <footer>
            © 2026 · Mi primer proyecto
        </footer>

    </main>

</body>
</html>
