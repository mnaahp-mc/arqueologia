<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bienvenido | Museo</title>

    <link rel="stylesheet"
          href="css/estilos.css">
</head>

<body>

    <main class="inicio">

        <!-- LOGO DE LA INSTITUCIÓN -->

        <img
            src="img/logo.png"
            alt="Logo de la institución"
        >


        <!-- BIENVENIDA -->

        <section class="bienvenida">

            <h1>
                Bienvenido
            </h1>

            <p class="subtitulo">
                ¿Estás dispuesto a vivir esta experiencia?
            </p>

            <p>
                Descubre más sobre nuestro patrimonio
                a través de esta experiencia digital.
            </p>


            <button
                class="boton"
                onclick="iniciarExperiencia()">

                COMENZAR

            </button>

        </section>

    </main>


    <!-- JavaScript -->

    <script src="js/app.js"></script>

</body>

</html>
